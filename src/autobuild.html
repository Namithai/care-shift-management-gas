<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
body{font-family:"Meiryo","Hiragino Kaku Gothic ProN",sans-serif;margin:0;padding:12px 16px;color:#222;}
h2{font-size:16px;margin:0 0 10px;}
.box{padding:10px 12px;background:#f2f5f8;border:1px solid #d7dee6;border-radius:6px;margin-bottom:10px;}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:8px;}
label{font-size:13px;}
select,input[type=month]{font-size:14px;padding:3px 4px;}
#run,#see{font-size:15px;padding:7px 22px;cursor:pointer;}
#see{background:#eef3f7;}
#info{font-size:13px;color:#444;line-height:1.7;}
#log{margin-top:10px;padding:10px 12px;background:#fff;border:1px solid #c8d2dc;border-radius:6px;font-size:13px;line-height:1.8;white-space:pre-wrap;min-height:120px;}
.note{font-size:12px;color:#666;margin-top:6px;}
.warn{color:#c0392b;}
#ask{display:none;align-items:center;gap:12px;margin:8px 0;padding:10px 12px;background:#fff3cd;border:1px solid #e0c86a;border-radius:6px;font-size:13px;}
#ask button{font-size:14px;padding:5px 16px;cursor:pointer;}
#askYes{background:#c0392b;color:#fff;border:1px solid #a5311f;border-radius:4px;}
#askNo{background:#fff;border:1px solid #b9c4ce;border-radius:4px;}
</style>
</head>
<body>
<h2>シフトを自動で組む</h2>
<div class="box">
  <div class="row">
    <label>年月 <input type="month" id="ym"></label>
    <label>どこまで実行する <select id="upto">
      <option value="all">最後まで</option>
      <option value="step0">ステップ0 希望休の反映まで</option>
      <option value="step1">ステップ1 夜勤まで</option>
      <option value="step2">ステップ2 公休まで</option>
      <option value="step3">ステップ3 早番・遅番・日勤まで</option>
    </select></label>
  </div>
  <div class="row">
    <span>既に入っているシフト</span>
    <label><input type="radio" name="mode" value="keep" checked> 残して空いているところだけ埋める</label>
    <label><input type="radio" name="mode" value="clear"> 全部消して作り直す</label>
  </div>
  <div class="row">
    <label>1人あたりの月の夜勤回数の上限 <input type="number" id="nightMax" min="1" max="15" step="1" style="width:56px"> 回</label>
    <label>夜勤の間隔 <select id="nightGap"><option value="3">夜→明の次の日は空ける</option><option value="2">夜→明の翌日から入ってよい</option></select></label>
    <label><input type="checkbox" id="needLeader"> 夜勤リーダーを毎日1人入れる</label>
    <label>連勤の上限 <input type="number" id="maxRun" min="2" max="14" step="1" style="width:56px"> 日</label>
  </div>
  <div class="row">
    <button id="run">実行</button>
    <button id="see">シフト表を見る</button>
    <span id="msg"></span>
  </div>
</div>
<div id="ask">
  <span id="askText"></span>
  <button id="askYes">はい</button>
  <button id="askNo">いいえ</button>
</div>
<div id="info"></div>
<div id="log"></div>
<div class="note">「どこまで実行する」で、途中まで自動・残りは手で、という使い方もできます。ここでの設定は次に開いたときの初期値として覚えます。夜勤専従の人は回数の上限の対象外です。</div><script>
var ASKFN = null;
function ask(text, fn){
  ASKFN = fn;
  document.getElementById("askText").textContent = text;
  document.getElementById("ask").style.display = "flex";
}
function askHide(){ document.getElementById("ask").style.display = "none"; ASKFN = null; }
function askInit(){
  document.getElementById("askYes").addEventListener("click", function(){ var f = ASKFN; askHide(); if (f) f(); });
  document.getElementById("askNo").addEventListener("click", askHide);
}
function el(id){ return document.getElementById(id); }
function msg(t, c){ el("msg").textContent = t || ""; el("msg").style.color = c || "#555"; }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function nextMonth(){ var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 1); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
function mode(){ var r = document.querySelectorAll("input[name=mode]"); for (var i=0;i<r.length;i++){ if (r[i].checked) return r[i].value; } return "keep"; }
function loadInfo(){
  el("info").textContent = "読み込み中...";
  google.script.run.withSuccessHandler(onInfo).withFailureHandler(fail).getAutoBuildInfoJson(el("ym").value);
}
function onInfo(json){
  var d = JSON.parse(json);
  var t = d.ym + " ／ " + d.days + "日 ／ 対象スタッフ " + d.staffCount + "人";
  t += " ／ 既に入っているマス " + d.filled + " ／ 申請 希望休 " + d.reqOff + "件・出勤希望 " + d.reqWork + "件";
  el("info").textContent = t;
}
function run(){
  if (mode() === "clear"){ ask("この月のシフトを全部消して作り直します。よろしいですか？", doRun); return; }
  doRun();
}
function doRun(){
  el("run").disabled = true;
  msg("実行中...");
  el("log").textContent = "";
  google.script.run.withSuccessHandler(function(r){
    el("run").disabled = false;
    msg("終わりました", "#1e7e34");
    el("log").textContent = r;
    loadInfo();
  }).withFailureHandler(function(e){ el("run").disabled = false; fail(e); }).runAutoBuild(el("ym").value, el("upto").value, mode(), { nightMax: Number(el("nightMax").value) || 4, needLeader: el("needLeader").checked, nightGap: Number(el("nightGap").value) || 3, maxRun: Number(el("maxRun").value) || 6 });
}
function fail(e){ msg("エラー: " + (e && e.message ? e.message : e), "#c0392b"); }
function start(){
  el("ym").value = nextMonth();
  el("ym").addEventListener("change", loadInfo);
  el("run").addEventListener("click", run);
  el("see").addEventListener("click", function(){ msg("シフト表を開きます..."); google.script.run.withFailureHandler(fail).openShiftTable(); });
  askInit();
  el("nightMax").value = 4;
  el("nightGap").value = "3";
  el("maxRun").value = 6;
  el("needLeader").checked = true;
  google.script.run.withSuccessHandler(function(json){
    try {
      var s = JSON.parse(json);
      if (s.upto) el("upto").value = s.upto;
      if (s.mode) { var r = document.querySelectorAll("input[name=mode]"); for (var i=0;i<r.length;i++){ r[i].checked = (r[i].value === s.mode); } }
      if (s.nightMax) el("nightMax").value = s.nightMax;
      if (s.nightGap) el("nightGap").value = String(s.nightGap);
      if (s.maxRun) el("maxRun").value = s.maxRun;
      el("needLeader").checked = (s.needLeader !== false);
    } catch(e){}
  }).getAutoBuildSettingsJson();
  loadInfo();
}
start();
</script>
</body>
</html>
